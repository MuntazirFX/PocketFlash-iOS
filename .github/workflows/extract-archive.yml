
name: Extract Archive.zip

on:
  workflow_dispatch:
  push:
    paths:
      - "Archive.zip"

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Extract ZIP
        run: |
          set -e
          mkdir -p extracted
          unzip -o Archive.zip -d extracted
          echo "ZIP contents:"
          find extracted -maxdepth 5 -print | head -300

      - name: Find and copy Flutter source
        run: |
          set -e
          PUBSPEC="$(find extracted -type f -name pubspec.yaml -print -quit)"

          if [ -z "$PUBSPEC" ]; then
            echo "ERROR: pubspec.yaml ZIP mein nahi mila."
            exit 1
          fi

          SOURCE_DIR="$(dirname "$PUBSPEC")"
          echo "Found project: $SOURCE_DIR"

          cp -R "$SOURCE_DIR"/. .
          rm -rf extracted
          rm -f Archive.zip

          test -f pubspec.yaml
          test -f lib/main.dart

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "Extract PocketFlash source"
            git push
          fi
